# Perfil exclusivo para testes End-to-End (Playwright).
# Usa um banco H2 em memoria, isolado do PostgreSQL de desenvolvimento/producao.
spring.datasource.url=jdbc:h2:mem:fatecads_e2e;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
server.port=8080
