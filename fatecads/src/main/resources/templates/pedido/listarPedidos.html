<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/app.css?v=cloud-20260518">
    <title>Lista de Pedidos</title>
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">
                <span class="brand-mark">ADS</span>
                <span>Sistema Fatec ADS</span>
            </a>
            <nav class="nav" aria-label="Navegacao principal">
                <a href="/home">Painel</a>
                <a href="/pedido/listar" aria-current="page">Pedidos</a>
                <form th:action="@{/logout}" method="post">
                    <button class="button" type="submit">Sair</button>
                </form>
            </nav>
        </header>

        <section class="page-header">
            <div>
                <p class="eyebrow">Gestão comercial</p>
                <h1 class="page-title">Pedidos</h1>
                <p class="page-subtitle">Acompanhe os pedidos cadastrados no sistema.</p>
            </div>
            <a class="button button-primary" href="/pedido/criar">Novo pedido</a>
        </section>

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h2 class="panel-title">Pedidos cadastrados</h2>
                    <p class="panel-caption">Lista de pedidos com usuario, data e total.</p>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Data</th>
                            <th>Total</th>
                            <th>Acoes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${pedido.idPedido}">-</td>
                            <td th:text="${pedido.usuario != null ? pedido.usuario.nomeUsuario : 'Usuario nao informado'}">-</td>
                            <td th:text="${pedido.dataPedido}">-</td>
                            <td th:text="${'R$ ' + #numbers.formatDecimal(pedido.totalPedido, 1, 'POINT', 2, 'COMMA')}">-</td>
                            <td>
                                <div class="actions table-actions">
                                <a class="button button-primary" th:href="@{/pedido/consultar/{id}(id=${pedido.idPedido})}">Consultar</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(pedidos)}">Nenhum pedido cadastrado.</div>
        </section>
    </main>
</body>
</html>
