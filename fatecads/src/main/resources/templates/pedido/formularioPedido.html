<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pedido</title>
</head>
<body>
    <h1 style="text-align: center;">Formulário de Pedido</h1>
    <datalist id="listaAlunos">
        <option th:each="aluno : ${alunos}" 
            th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno}">
        </option>
    </datalist>
    
    <datalist id="listaProdutos">
        <option th:each="produto : ${produtos}" 
            th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
            th:attr="data-preco=${produto.valorProduto}">
        </option>
    </datalist>

    <h1>Cadastro de Pedido</h1>
    <a th:href="@{/home}">Voltar</a>
    <label for="aluno">Aluno</label>
    <br />
    <input list="listaAlunos" id="aluno" type="text" placeholder="Digite o nome ou codigo do aluno"/>
    <br /><br />

    <label for="imagemPedido">Imagem do pedido</label>
    <input id="imagemPedido" type="file" accept="image/*" />
    <br />
    <img id="previewImagemPedido" alt="Prévia da imagem do pedido"
        style="display: none; max-width: 240px; max-height: 160px; object-fit: contain;" />
    <br /><br />

    <p>II. Adicionar produto ao pedido</p>
    <label for="produto">Produto</label>
    <input list="listaProdutos" id="produto" type="text" placeholder="Digite o produto"/>
    <br /><br />

    <label for="quantidade">Quantidade</label>
    <input type="number" id="quantidade" placeholder="0" min="1" value="1" />
    <br />
    <button type="button" onclick="adicionarItem()">
        <span>+</span>Adicionar
    </button>

    <!-- Tabela de Itens -->

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço Unit.</th>
                <th>Subtotal</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabela-itens">
            <tr id="empty-row">
                <td colspan="5">Nenhum produto adicionado ao pedido</td>
            </tr>
        </tbody>
    </table>
    <span>Total do Pedido</span>
    <span>R$ <span id="totalPedido">0,00</span></span>
    <br /><br />
    <button onclick="salvarPedido()">Confirmar e salvar pedido</button>

    <script>
        let itens = [];
 
        function adicionarItem() {
            let produtoInput = document.getElementById("produto").value;
            let quantidade = document.getElementById("quantidade").value;
 
            if (!produtoInput || quantidade <= 0) {
                alert("Preencha corretamente o produto e a quantidade!");
                return;
            }
 
            let partes = produtoInput.split(" - ");
            let produtoId = partes[0];
            let produtoNome = partes[1];
 
            let options = document.querySelectorAll("#listaProdutos option");
            let preco = null;
 
            options.forEach(opt => {
                if (opt.value === produtoInput) {
                    preco = opt.getAttribute("data-preco");
                }
            });
 
            if (!preco) {
                alert("Produto inválido! Selecione um produto da lista.");
                return;
            }
 
            let subtotal = quantidade * preco;
 
            itens.push({
                produto: { idProduto: produtoId },
                nomeProduto: produtoNome,
                quantidade: parseInt(quantidade),
                preco: parseFloat(preco),
                subtotal: subtotal
            });
 
            document.getElementById("produto").value = "";
            document.getElementById("quantidade").value = "";
 
            renderTabela();
        }
 
        function removerItem(index) {
            itens.splice(index, 1);
            renderTabela();
        }
 
        function renderTabela() {
            let tabela = document.getElementById("tabela-itens");
            tabela.innerHTML = "";
 
            if (itens.length === 0) {
                tabela.innerHTML = `<tr class="empty-row" id="empty-row"><td colspan="5">Nenhum produto adicionado ao pedido.</td></tr>`;
                document.getElementById("totalPedido").innerText = "0,00";
                return;
            }
 
            let total = 0;
 
            itens.forEach((item, index) => {
                total += item.subtotal;
                tabela.innerHTML += `
<tr>
<td>${item.nomeProduto}</td>
<td>${item.quantidade}</td>
<td>R$ ${item.preco.toFixed(2).replace('.', ',')}</td>
<td>R$ ${item.subtotal.toFixed(2).replace('.', ',')}</td>
<td><button class="btn-remove" onclick="removerItem(${index})">Remover</button></td>
</tr>
                `;
            });
 
            document.getElementById("totalPedido").innerText = total.toFixed(2).replace('.', ',');
        }
 
        function salvarPedido() {
            let alunoInput = document.getElementById("aluno").value;
 
            if (!alunoInput) {
                alert("Selecione um aluno antes de salvar!");
                return;
            }
 
            if (itens.length === 0) {
                alert("Adicione ao menos um produto ao pedido!");
                return;
            }
 
            let alunoId = alunoInput.split(" - ")[0];
 
            let pedido = {
                aluno: { idAluno: Number(alunoId) },
                itens: itens,
                imagemPedido: imagemPedido
            };
 
            fetch("/pedido", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(pedido)
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error("Falha ao salvar o pedido");
                }
            })
            .then(data => {
                alert("Pedido salvo com sucesso!");
                location.reload();
            })
            .catch(err => {
                alert("Erro ao salvar o pedido. Tente novamente.");
                console.error(err);
            });
        }

        let imagemPedido = null;
        document.getElementById("imagemPedido").addEventListener("change", function (event) {
            let arquivo = event.target.files[0];
            let preview = document.getElementById("previewImagemPedido");

            if (!arquivo) {
                imagemPedido = null;
                preview.src = "";
                preview.style.display = "none";
                return;
            }

            let leitor = new FileReader();
            leitor.onload = function () {
                imagemPedido = leitor.result;
                preview.src = imagemPedido;
                preview.style.display = "block";
            };
            leitor.readAsDataURL(arquivo);
        });
</script>

</body>
</html>
