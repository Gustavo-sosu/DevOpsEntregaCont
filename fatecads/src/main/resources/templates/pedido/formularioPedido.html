<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pedido</title>
</head>
<body>
    <h1 style="text-align: center;">Formulário de Pedido</h1>
    <dataList id="listaAlunos">
        <option th:each="aluno : ${alunos}" 
            th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno}">
        </option>
    </dataList>
    
</body>
</html>
