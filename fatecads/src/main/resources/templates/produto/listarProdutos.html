<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
</head>
<body>
    <h1 style="text-align: center;">Lista de Produtos</h1>
    <h2 style="text-align: center;">
        <a th:href="@{/produto/criar}">Adicionar Novo Produto</a>
    </h2>
    <table>
        <tr>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Unidade</th>
            <th>Marca</th>
        </tr>
        <tr th:each="produto : ${produtos}">
            <td th:text="${produto.descricaoProduto}"></td>
            <td th:text="${produto.valorProduto}"></td>
            <td th:text="${produto.unidadeProduto}"></td>
            <td th:text="${produto.marcaProduto}"></td>

            <td>
                <a th:href="@{/produto/editar/{id}(id=${produto.idProduto})}">Editar</a>
                <a th:href="@{/produto/excluir/{id}(id=${produto.idProduto})}">Excluir</a>
        </tr>
    </table>
    
</body>
</html>
