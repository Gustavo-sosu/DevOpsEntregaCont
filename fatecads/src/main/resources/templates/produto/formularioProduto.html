<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Produto</title>
</head>
<body>
    <h1 style="text-align: center;">Cadastro de Produto</h1>
    <form th:action="@{/produto/salvar}" method="post" th:object="${produto}">
        <input type="hidden" name="idProduto" th:field="*{idProduto}"/>
        <label for="descricaoProduto">Descrição do produto</label>
        <input type="text" id="descricaoProduto" th:field="*{descricaoProduto}"/>
        <br /><br />
        <label for="valorProduto">Valor</label>
        <input type="number" step="0.01" id="valorProduto" th:field="*{valorProduto}"/>
        <br /><br />
        <label for="unidadeMedida"> Unidade</label>
        <input type="text" id="unidadeMedida" th:field="*{unidadeMedida}"/>
        <br /><br />
        <label for="marcaProduto">Marca</label>
        <input type="text" id="marcaProduto" th:field="*{marcaProduto}"/>
        <br /><br />
        <input type="submit" value="Salvar"/>
    </form>
</body>
</html>
