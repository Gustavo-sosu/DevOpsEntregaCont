<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/app.css?v=product-image-20260928">
    <title>Cadastro de Produto</title>
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="/home"><span class="brand-mark">ADS</span><span>Sistema Fatec ADS</span></a>
            <nav class="nav" aria-label="Navegacao administrativa">
                <a href="/home">Painel</a>
                <a href="/produto/listar" aria-current="page">Produtos</a>
            </nav>
        </header>
        <section class="page-header">
            <div>
                <p class="eyebrow">Gestao administrativa</p>
                <h1 class="page-title" th:text="${produto.idProduto == null ? 'Cadastro de produto' : 'Editar produto'}">Cadastro de produto</h1>
                <p class="page-subtitle">Preencha os dados e escolha uma imagem para o produto.</p>
            </div>
        </section>
        <form class="panel form-panel" th:action="@{/produto/salvar}" method="post" enctype="multipart/form-data" th:object="${produto}">
            <input type="hidden" th:field="*{idProduto}">
            <div class="form-grid">
                <div class="field">
                    <label for="descricaoProduto">Descricao do produto</label>
                    <input type="text" id="descricaoProduto" th:field="*{descricaoProduto}" required>
                </div>
                <div class="field">
                    <label for="valorProduto">Valor</label>
                    <input type="number" step="0.01" min="0" id="valorProduto" th:field="*{valorProduto}" required>
                </div>
                <div class="field">
                    <label for="unidadeMedida">Unidade</label>
                    <input type="text" id="unidadeMedida" th:field="*{unidadeMedida}" required>
                </div>
                <div class="field">
                    <label for="marcaProduto">Marca</label>
                    <input type="text" id="marcaProduto" th:field="*{marcaProduto}" required>
                </div>
                <div class="field field-full">
                    <label for="arquivoImagemProduto">Imagem do produto</label>
                    <input type="file" id="arquivoImagemProduto" name="arquivoImagemProduto" accept="image/*">
                    <img class="product-form-preview" id="previewImagemProduto"
                         th:src="${produto.imagemProduto}"
                         th:classappend="${produto.imagemProduto == null or #strings.isEmpty(produto.imagemProduto)} ? ' is-empty' : ''"
                         alt="Previa da imagem do produto">
                </div>
            </div>
            <div class="form-actions">
                <button class="button button-primary" type="submit">Salvar produto</button>
                <a class="button" href="/produto/listar">Cancelar</a>
            </div>
        </form>
    </main>
    <script>
        const imageFileInput = document.getElementById("arquivoImagemProduto");
        const imagePreview = document.getElementById("previewImagemProduto");

        imageFileInput.addEventListener("change", event => {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert("A imagem deve ter no maximo 5 MB.");
                imageFileInput.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                imagePreview.src = reader.result;
                imagePreview.classList.remove("is-empty");
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
